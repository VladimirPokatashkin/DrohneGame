<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Drohne Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { display: flex; height: 100vh; background: #1e1e1e; color: #fff; }

        /* Левая панель - Код */
        .editor-panel { width: 40%; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-right: 2px solid #333; }
        textarea { flex: 1; background: #2d2d2d; color: #00ff66; border: 1px solid #444; padding: 10px; font-size: 14px; resize: none; border-radius: 4px; }
        button { padding: 12px; background: #007acc; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #005999; }
        .console { height: 120px; background: #000; color: #00ff66; padding: 10px; border-radius: 4px; overflow-y: auto; white-space: pre-wrap; border: 1px solid #333; }

        /* Правая панель - Лабиринт */
        .viewer-panel { width: 60%; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .controls { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .grid-container { display: grid; gap: 2px; background: #333; border: 2px solid #555; padding: 2px; }
        .cell { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: background 0.15s ease; }

        /* Цвета элементов лабиринта */
        .cell.wall { background: #444; }
        .cell.path { background: #111; }
        .cell.start { background: #1b5e20; }
        .cell.exit { background: #b71c1c; }

        /* Дрон и эффекты сканирования */
        .cell.drone { background: #00b0ff; border-radius: 50%; box-shadow: 0 0 10px #00b0ff; transition: all 0.1s ease; }

        /* Импульсный эффект при сканировании */
        .cell.drone.scanning {
            background: #ffd700 !important;
            box-shadow: 0 0 15px #ffd700, 0 0 25px #ffd700 !important;
            transform: scale(1.15);
        }

        /* Подсветка луча сканера */
        .cell.scanned-beam {
            background: rgba(255, 215, 0, 0.35) !important;
            box-shadow: inset 0 0 5px #ffd700;
        }

        /* Клетка столкновения */
        .cell.drone.crashed {
            background: #ff0000 !important;
            box-shadow: 0 0 15px #ff0000 !important;
        }
    </style>
</head>
<body>

<!-- Панель ввода кода -->
<div class="editor-panel">
    <h2>Редактор кода DSL</h2>
    <textarea id="codeEditor" placeholder="Введи код для дрона..."></textarea>
    <button id="runBtn" onclick="runScript()">▶ Запустить код</button>
    <div id="console" class="console">Логи и ошибки появятся здесь...</div>
</div>

<!-- Панель визуализации лабиринта -->
<div class="viewer-panel">
    <div class="controls">
        <label>Уровень Z: </label>
        <select id="levelSelect" onchange="renderCurrentLevel()"></select>
        <label style="margin-left: 15px;">Скорость (мс): </label>
        <input type="range" id="speedRange" min="30" max="400" value="100" step="10">
        <span id="speedVal">100ms</span>
    </div>
    <div id="mazeGrid" class="grid-container"></div>
</div>

<script>
    let mazeData = []; // Трехмерный массив уровней от сервера
    let currentZ = 0;
    let animationTimer = null;
    let dronePos = null;

    // Обновление отображения скорости
    document.getElementById('speedRange').oninput = function() {
        document.getElementById('speedVal').textContent = this.value + 'ms';
    };

    // 1. При загрузке страницы скачиваем структуру лабиринта
    window.onload = async () => {
        try {
            const response = await fetch('/api/maze/maze');
            const data = await response.json();
            mazeData = data.levels;
            console.log("Загружен лабиринт:", data);

            dronePos = findStartPos();
            initLevelSelector();
            renderCurrentLevel();
        } catch (err) {
            logError("Не удалось загрузить лабиринт: " + err);
        }
    };

    function findStartPos() {
        for (let z = 0; z < mazeData.length; z++) {
            for (let y = 0; y < mazeData[z].length; y++) {
                for (let x = 0; x < mazeData[z][y].length; x++) {
                    if (mazeData[z][y][x] === 'S') {
                        return { x: x, y: y, z: z };
                    }
                }
            }
        }
        return { x: 0, y: 0, z: 0 };
    }

    function initLevelSelector() {
        const select = document.getElementById('levelSelect');
        select.innerHTML = '';
        for (let z = 0; z < mazeData.length; z++) {
            const opt = document.createElement('option');
            opt.value = z;
            opt.textContent = `Слой Z = ${z}`;
            select.appendChild(opt);
        }
    }

    // 2. Отрисовка выбранного слоя лабиринта
    function renderCurrentLevel() {
        currentZ = parseInt(document.getElementById('levelSelect').value) || 0;
        const grid = document.getElementById('mazeGrid');
        const level = mazeData[currentZ];

        if (!level) return;

        const height = level.length;
        const width = level[0].length;

        grid.style.gridTemplateColumns = `repeat(${width}, 30px)`;
        grid.innerHTML = '';

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const char = level[y][x];
                const cell = document.createElement('div');
                cell.className = 'cell ';

                if (char === '#') cell.className += 'wall';
                else if (char === 'S') cell.className += 'start';
                else if (char === 'E') cell.className += 'exit';
                else cell.className += 'path';

                if (dronePos.x === x && dronePos.y === y && dronePos.z === currentZ) {
                    cell.className += ' drone';
                    cell.textContent = '🛸';
                }

                cell.id = `cell-${x}-${y}-${currentZ}`;
                grid.appendChild(cell);
            }
        }
    }

    // 3. Отправка кода на Spring Boot сервер
    async function runScript() {
        const code = document.getElementById('codeEditor').value;
        const consoleDiv = document.getElementById('console');
        consoleDiv.style.color = '#00ff66';
        consoleDiv.textContent = "Выполнение...";

        if (animationTimer) clearInterval(animationTimer);

        try {
            const response = await fetch('/api/drohne/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            });

            const result = await response.json();
            console.log("Шаги от сервера:", result.steps);

            // Обработка статуса и ошибки от InterpreterService
            const errorType = result.error || result.status;
            const errorMsg = result.message || result.errorMessage;

            if (errorType && errorType !== "") {
                consoleDiv.style.color = '#ff5555';
                consoleDiv.textContent = `[${errorType.toUpperCase()}]: ${errorMsg}`;
            } else {
                consoleDiv.style.color = '#00ff66';
                consoleDiv.textContent = "Код успешно выполнен!";
            }

            // 4. Запуск пошаговой анимации
            animateSteps(result.steps, errorType === "crashed");

        } catch (err) {
            consoleDiv.style.color = '#ff5555';
            consoleDiv.textContent = "Ошибка сети: " + err;
        }
    }

    // 5. Движок анимации шагов дрона
    function animateSteps(steps, isCrash = false) {
        if (!steps || steps.length === 0) return;

        let stepIndex = 0;
        const speed = parseInt(document.getElementById('speedRange').value) || 100;

        animationTimer = setInterval(() => {
            clearScanHighlights(); // Очищаем прошлые лучи сканера

            if (stepIndex >= steps.length) {
                clearInterval(animationTimer);
                if (isCrash) {
                    const crashCell = document.getElementById(`cell-${dronePos.x}-${dronePos.y}-${dronePos.z}`);
                    if (crashCell) crashCell.classList.add('crashed');
                }
                return;
            }

            const step = steps[stepIndex];
            const oldPos = { ...dronePos };
            dronePos = { x: step.x, y: step.y, z: step.z };

            // Автопереключение уровня Z
            if (document.getElementById('levelSelect').value != step.z) {
                document.getElementById('levelSelect').value = step.z;
                renderCurrentLevel();
            } else {
                moveDroneUI(oldPos, dronePos);
            }

            // Проверка и подсветка действия сканирования
            const scanDir = step.scanDirection || step.direction || step.scanned;
            if (step.type === 'SCAN' || step.action === 'SCAN' || scanDir) {
                highlightScan(dronePos, scanDir);
            }

            stepIndex++;
        }, speed);
    }

    // Перемещение иконки дрона без перерисовки всей сетки
    function moveDroneUI(oldPos, newPos) {
        if (oldPos) {
            const oldCell = document.getElementById(`cell-${oldPos.x}-${oldPos.y}-${oldPos.z}`);
            if (oldCell) {
                oldCell.className = oldCell.className.replace(' drone', '').replace(' scanning', '');
                oldCell.textContent = '';
            }
        }
        if (newPos) {
            const newCell = document.getElementById(`cell-${newPos.x}-${newPos.y}-${newPos.z}`);
            if (newCell) {
                newCell.classList.add('drone');
                newCell.textContent = '🛸';
            }
        }
    }

    // Подсветка сканирующего луча
    function highlightScan(pos, direction) {
        const droneCell = document.getElementById(`cell-${pos.x}-${pos.y}-${pos.z}`);
        if (droneCell) droneCell.classList.add('scanning');

        if (!direction) return;

        let dx = 0, dy = 0;
        const dir = direction.toLowerCase();

        if (dir.includes('left')) dx = -1;
        else if (dir.includes('right')) dx = 1;
        else if (dir.includes('forward') || dir.includes('front')) dy = -1;
        else if (dir.includes('back')) dy = 1;

        if (dx === 0 && dy === 0) return; // Для UP/DOWN подсвечивается только сам дрон

        let currX = pos.x + dx;
        let currY = pos.y + dy;

        // Рисуем луч до ближайшей стены
        while (currY >= 0 && currY < mazeData[pos.z].length &&
               currX >= 0 && currX < mazeData[pos.z][currY].length) {

            const cell = document.getElementById(`cell-${currX}-${currY}-${pos.z}`);
            if (!cell || mazeData[pos.z][currY][currX] === '#') break;

            cell.classList.add('scanned-beam');
            currX += dx;
            currY += dy;
        }
    }

    // Очистка эффектов сканирования
    function clearScanHighlights() {
        document.querySelectorAll('.scanned-beam').forEach(el => el.classList.remove('scanned-beam'));
        document.querySelectorAll('.scanning').forEach(el => el.classList.remove('scanning'));
    }

    function logError(msg) {
        const consoleDiv = document.getElementById('console');
        consoleDiv.style.color = '#ff5555';
        consoleDiv.textContent = msg;
    }
</script>
</body>
</html>
